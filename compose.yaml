services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reserivo
      POSTGRES_PASSWORD: reserivo
      POSTGRES_DB: reserivo
    ports:
      - "5433:5432"  # 5433 on the host: a native Postgres often owns 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserivo -d reserivo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Watches packages/shared and rebuilds dist/ on the bind mount, which api and
  # web both read. Restart api after shared changes (nest's tsc watch does not
  # re-resolve node_modules).
  shared:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    command: ["npm", "run", "dev", "-w", "@reserivo/shared", "--prefix", "/app"]
    working_dir: /app
    environment:
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - shared_node_modules:/app/packages/shared/node_modules

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      NODE_ENV: development
      DATABASE_URL: postgresql://reserivo:reserivo@postgres:5432/reserivo
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      WEB_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:3001
      # Accounts that always hold site admin (comma-separated). Grant-only.
      SITE_ADMIN_EMAILS: ${SITE_ADMIN_EMAILS:-james@akkija.com}
      # Email: leave RESEND_API_KEY unset locally and notifications are only logged.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Reserivo <onboarding@resend.dev>}
      # Campaign email sends on its own key and its own verified subdomain, so a
      # salon's complaint rate cannot reach the reputation carrying password
      # resets. Unset locally: campaigns are logged, same as notifications.
      RESEND_MARKETING_API_KEY: ${RESEND_MARKETING_API_KEY:-}
      EMAIL_MARKETING_FROM: ${EMAIL_MARKETING_FROM:-}
      # SMS stays dark until all three are set (and the number is A2P 10DLC registered).
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      # Bind mounts from Windows deliver no inotify events; tsc must poll.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      shared:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    # Turbopack cannot poll and Windows bind mounts emit no inotify events, so
    # dev runs on webpack with WATCHPACK_POLLING. Drop --webpack on Linux/WSL.
    command: ["sh", "-c", "npm run build -w @reserivo/shared --prefix /app && npm run dev -- --webpack --hostname 0.0.0.0"]
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_URL_INTERNAL: http://api:3001
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
      - web_next:/app/apps/web/.next
    depends_on:
      - api
      - shared

volumes:
  postgres_data:
  redis_data:
  root_node_modules:
  api_node_modules:
  web_node_modules:
  shared_node_modules:
  web_next:
