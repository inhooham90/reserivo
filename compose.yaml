services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules

volumes:
  web_node_modules:
  api_node_modules: